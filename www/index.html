<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hamim Bird</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@600;700&family=Pixelify+Sans:wght@500;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: slim top bar, then one field that fills the rest of the screen. HUD chips float over the field. */
:root {
  --bg: #0b1a24;
  --panel: #102534;
  --panel2: #16303f;
  --line: #2c5068;
  --fg: #eaf4ef;
  --muted: #8fb0bf;
  --accent: #ff3d8b;
  --accent-ink: #1a0610;
  --gold: #ffd23f;
  --good: #4be38a;
  --bad: #ff5a5a;
  --font-display: "Pixelify Sans", "Courier New", monospace;
  --font-label: "Silkscreen", "Courier New", monospace;
  --font-bn: "Noto Sans Bengali", "Hind Siliguri", "Nirmala UI", "Bangla MN", "Noto Sans", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  padding-block: 6px;
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
  background: var(--bg);
  color: var(--fg);
  font: 500 15px/1.35 var(--font-display);
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
.app { height: 100%; display: flex; flex-direction: column; gap: 6px; max-width: 1400px; margin: 0 auto; min-height: 0; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; flex: none; }
h1 { margin: 0; font: 700 22px/1 var(--font-display); letter-spacing: 0.01em; }
.tools { display: flex; gap: 6px; align-items: center; }
.btn-small {
  font: 400 11px var(--font-label); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); background: var(--panel); border: 1px solid var(--line);
  padding: 9px 11px; cursor: pointer; border-radius: 2px;
}
.btn-small:hover { border-color: var(--muted); }
.btn-small:focus-visible, .btn:focus-visible, .credit summary:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
.credit { position: relative; }
.credit summary {
  list-style: none; font: 400 11px var(--font-label); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); background: var(--panel); border: 1px solid var(--line); padding: 9px 11px; cursor: pointer; border-radius: 2px;
}
.credit summary::-webkit-details-marker { display: none; }
.credit summary::after { content: " \25BE"; }
.credit[open] summary::after { content: " \25B4"; }
.credit-body {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; width: max-content; max-width: min(300px, 80vw);
  background: var(--panel); border: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 6px;
}
.credit-body .by { margin: 0; font: 700 16px/1.25 var(--font-display); }
.credit-body a { color: var(--accent); font: 500 15px var(--font-display); text-decoration: none; overflow-wrap: anywhere; }

.field {
  position: relative; flex: 1; min-height: 0; border: 2px solid var(--line); border-radius: 3px;
  overflow: hidden; background: #08121a; touch-action: none; user-select: none; -webkit-user-select: none;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: none; touch-action: none; }

.hud { position: absolute; top: 6px; left: 6px; right: 6px; z-index: 2; pointer-events: none; display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  background: rgba(8, 20, 30, 0.74); border: 1px solid rgba(255, 255, 255, 0.14);
  padding: 3px 8px; display: flex; align-items: center; gap: 6px; min-width: 0; height: 26px;
}
.chip .k { font: 400 9px var(--font-label); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.chip .v { font: 700 16px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.chip.gold .v { color: var(--gold); }
.bn { font-family: var(--font-bn); font-weight: 700; font-size: 12px; color: var(--gold); }
.coin { display: inline-block; width: 10px; height: 10px; background: var(--gold); border: 2px solid #b8860b; border-radius: 50%; flex: none; }
.lives { display: flex; gap: 4px; align-items: center; }
.life { width: 9px; height: 12px; border-radius: 50% 50% 50% 50% / 55% 55% 45% 45%; background: var(--accent); transition: opacity 0.2s; }
.life.off { background: #2a3b49; opacity: 0.6; }

.slots { position: absolute; left: 6px; bottom: 30px; z-index: 3; display: flex; flex-direction: column-reverse; gap: 5px; }
.slot {
  position: relative; width: 44px; height: 52px; padding: 0; background: rgba(8, 20, 30, 0.8); border: 2px solid var(--line);
  cursor: pointer; display: grid; place-items: center; overflow: hidden;
}
.slot canvas { position: static; width: 28px; height: 42px; image-rendering: pixelated; cursor: pointer; }
.slot.on { border-color: var(--gold); }
.slot.broken canvas { filter: grayscale(1) brightness(0.5); }
.slot .cd { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.62); display: grid; place-items: center; font: 700 16px var(--font-display); color: #fff; }
.slot .hp { position: absolute; left: 3px; right: 3px; bottom: 2px; height: 3px; background: #1a2a36; }
.slot .hp i { display: block; height: 100%; background: var(--good); }
.slot .num { position: absolute; top: 1px; left: 3px; font: 400 8px var(--font-label); color: var(--muted); }

.overlay { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; padding: 10px; background: rgba(4, 10, 16, 0.66); }
.panel {
  background: rgba(11, 26, 36, 0.97); border: 2px solid var(--line); box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.45);
  padding: 18px 20px; width: min(560px, 100%); max-height: 100%; overflow: auto; display: grid; gap: 12px; min-width: 0;
}
.panel.wide { width: min(860px, 100%); }
.panel h2 { margin: 0; font: 700 30px/1 var(--font-display); }
.panel p { margin: 0; color: var(--muted); font-size: 15px; }
.panel .sub { color: var(--fg); }
.tag { color: var(--accent); font: 400 11px var(--font-label); letter-spacing: 0.1em; text-transform: uppercase; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row .k { font: 400 10px var(--font-label); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); min-width: 78px; }
.seg { display: inline-flex; border: 1px solid var(--line); }
.seg button {
  font: 400 11px var(--font-label); letter-spacing: 0.06em; text-transform: uppercase; background: var(--panel);
  color: var(--muted); border: 0; border-right: 1px solid var(--line); padding: 9px 11px; cursor: pointer;
}
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.btn {
  font: 700 13px var(--font-label); letter-spacing: 0.08em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink);
  border: 0; padding: 13px 18px; cursor: pointer; border-radius: 2px; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.4);
}
.btn:hover { filter: brightness(1.1); }
.btn.alt { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); }
.btn.gold { background: var(--gold); color: #2a1c00; }
.btn:disabled { opacity: 0.45; cursor: default; filter: none; }
.btn.sm { padding: 9px 12px; font-size: 11px; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.results { display: grid; grid-template-columns: auto 1fr; gap: 4px 18px; margin: 0; }
.results dt { font: 400 10px var(--font-label); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); align-self: center; }
.results dd { margin: 0; font: 700 20px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.good { color: var(--good); } .bad { color: var(--bad); } .goldc { color: var(--gold); }

.mhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.wallet { display: inline-flex; align-items: center; gap: 7px; font: 700 20px var(--font-display); color: var(--gold); }
.tabs { display: flex; gap: 0; border-bottom: 2px solid var(--line); }
.tabs button {
  font: 400 11px var(--font-label); letter-spacing: 0.08em; text-transform: uppercase; background: transparent; color: var(--muted);
  border: 0; padding: 10px 14px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px;
}
.tabs button.on { color: var(--fg); border-bottom-color: var(--accent); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.card { background: var(--panel); border: 1px solid var(--line); padding: 10px; display: grid; gap: 7px; align-content: start; min-width: 0; }
.card.eq { border-color: var(--gold); }
.card h3 { margin: 0; font: 700 16px/1.15 var(--font-display); }
.card .note { font-size: 12.5px; color: var(--muted); line-height: 1.3; }
.card .pv { display: grid; place-items: center; background: #0a1822; border: 1px solid var(--line); height: 112px; }
.card .pv canvas { position: static; image-rendering: pixelated; cursor: default; width: 64px; height: 96px; }
.card .pv.bgp canvas { width: 100%; height: 100%; }
.stat { display: grid; grid-template-columns: 54px 1fr; gap: 6px; align-items: center; font: 400 9px var(--font-label); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.stat i { display: block; height: 6px; background: #1a2a36; position: relative; }
.stat i b { display: block; height: 100%; background: var(--accent); }
.price { font: 700 15px var(--font-display); color: var(--gold); display: flex; align-items: center; gap: 5px; }
.msg { font-size: 13px; color: var(--gold); min-height: 18px; }
@media (max-width: 520px) {
  .panel { padding: 14px; }
  .panel h2 { font-size: 26px; }
  .grid { grid-template-columns: repeat(2, 1fr); }
  h1 { font-size: 19px; }
}
@media (max-height: 520px) {
  .slot { width: 36px; height: 40px; }
  .slot canvas { width: 20px; height: 30px; }
  .slots { bottom: 26px; gap: 3px; }
  .panel { padding: 12px 14px; gap: 8px; }
  .panel h2 { font-size: 24px; }
  .card .pv { height: 90px; }
}

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Hamim Bird</h1>
    <div class="tools">
      <button class="btn-small" id="btnPause" type="button" hidden>Pause</button>
      <button class="btn-small" id="btnMute" type="button" aria-pressed="false">Sound on</button>
      <details class="credit" id="credit">
        <summary>Created by</summary>
        <div class="credit-body">
          <p class="by">Wafi ul Karim Chowdhury</p>
          <a href="https://www.instagram.com/wafi_ul_karim_chowdhury2" target="_blank" rel="noopener noreferrer">@wafi_ul_karim_chowdhury2</a>
        </div>
      </details>
    </div>
  </header>

  <div class="field" id="field">
    <canvas id="c" aria-label="Game field. Tap or click to fire."></canvas>
    <div class="hud" id="hud" hidden>
      <div class="chip"><span class="k">Lv</span><span class="v" id="hLevel">1</span></div>
      <div class="chip"><span class="k">Acc</span><span class="v" id="hAcc">--</span></div>
      <div class="chip"><span class="k">Score</span><span class="v" id="hScore">0</span></div>
      <div class="chip"><span class="k">Combo</span><span class="v" id="hCombo">x1.0</span></div>
      <div class="chip gold"><i class="coin"></i><span class="bn">সততা</span><span class="v" id="hCoins">0</span></div>
      <div class="chip"><div class="lives" id="hLives" aria-label="Lives left"></div></div>
    </div>
    <div class="slots" id="slots" hidden></div>
    <div class="overlay" id="overlay" hidden><div class="panel" id="panel"></div></div>
  </div>
</div>

      else { G.gun = id; S.equipped = id; G.spin = 0; G.swapCd = 0; dirty = true; sfx('swap'); msg = GUNS[id].name + ' equipped.'; }
    } else { S.equipped = id; G.gun = id; dirty = true; sfx('swap'); msg = GUNS[id].name + ' equipped.'; }
  } else if (act === 'repair') { if (repairGun(id)) { sfx('buy'); msg = GUNS[id].name + ' repaired.'; if (G.needRepair) G.needRepair = 0; } else { msg = 'Not enough সততা.'; sfx('deny'); } }
  else if (act === 'buybg') {
    var b = BG_INFO[id]; if (S.bgOwned.indexOf(id) >= 0) msg = 'Already yours.'; else if (S.coins < b.price) { msg = 'Not enough সততা.'; sfx('deny'); }
    else { S.coins -= b.price; S.bgOwned.push(id); S.bg = id; dirty = true; hudDirty = true; sfx('buy'); msg = b.name + ' bought and set.'; persist(); }
  } else if (act === 'usebg') { S.bg = id; dirty = true; sfx('swap'); msg = BG_INFO[id].name + ' set.'; }
  panelState.msg = msg; uiMarket();
}

// ----- results -----
function uiBossResult() {
  var s = G.summary, k = s.k;
  musicPlay('shop', 0); duckMusic(1);
  showPanel('<div class="tag">Boss ' + k + ' of 10 defeated</div><h2>NiNishat falls</h2><p class="sub">' + esc(BOSS_TITLES[k]) + ' is down. Your guns are repaired and your lives are full.</p>' +
    '<dl class="results"><dt>Boss reward</dt><dd class="goldc">+' + fmt(s.boss) + ' ' + BN + '</dd><dt>Level reward</dt><dd class="goldc">+' + fmt(s.level) + ' ' + BN + '</dd>' + (s.bonus ? '<dt>Final bonus</dt><dd class="goldc">+' + fmt(s.bonus) + ' ' + BN + '</dd>' : '') + '<dt>Wallet</dt><dd>' + fmt(S.coins) + ' ' + BN + '</dd></dl>' +
    (k < 10 ? '<p>Next up: <b class="sub">' + esc(s.next) + '</b>' + (s.power ? '. New mutant power: <b class="sub">' + esc(s.power.name) + '</b> (' + esc(s.power.info) + ').' : '.') + '</p>' : '') +
    '<div class="btns"><button class="btn" type="button" data-act="next">' + (k >= 10 ? 'Finish' : 'Next level') + '</button><button class="btn gold" type="button" data-act="market">Market</button></div>');
  panelState.name = 'result'; panelState.from = 'result'; G.paused = false; hudDirty = true;
}
function uiGameOver() {
  var s = G.summary, why = { lives: 'Too many Hamims got away.', time: 'The boss broke your gun. Time ran out.', guns: 'All your guns broke.' }[G.reason] || 'Run over.';
  hudEl.hidden = false; btnPause.hidden = true; panelState.name = 'over'; panelState.from = 'over';
  showPanel('<div class="tag">Run over</div><h2>You lost</h2><p class="sub">' + why + '</p>' +
    '<dl class="results"><dt>Reached</dt><dd>Level ' + G.level + '</dd><dt>Score</dt><dd>' + fmt(G.score) + '</dd><dt>Wallet before</dt><dd>' + fmt(s.before) + ' ' + BN + '</dd><dt>Lost (half)</dt><dd class="bad">-' + fmt(s.lost) + ' ' + BN + '</dd><dt>You keep</dt><dd class="goldc">' + fmt(s.keep) + ' ' + BN + '</dd></dl>' +
    '<p>Your guns and backgrounds are safe. You start again from level 1.</p>' +
    '<div class="btns"><button class="btn" type="button" data-act="new">Play again</button><button class="btn gold" type="button" data-act="market">Market</button><button class="btn alt" type="button" data-act="menu">Menu</button></div>');
}
function uiVictory() {
  panelState.name = 'win'; panelState.from = 'win';
  showPanel('<div class="tag">All 50 levels cleared</div><h2>You won</h2><p class="sub">NiNishat is gone for good. Thank you for playing.</p>' +
    '<dl class="results"><dt>Score</dt><dd>' + fmt(G.score) + '</dd><dt>Wallet</dt><dd>' + fmt(S.coins) + ' ' + BN + '</dd></dl>' +
    '<div class="btns"><button class="btn" type="button" data-act="new">Play again</button><button class="btn gold" type="button" data-act="market">Market</button><button class="btn alt" type="button" data-act="menu">Menu</button></div>');
}

// ----- one click handler for every panel button -----
panel.addEventListener('click', function (ev) {
  var t = ev.target.closest ? ev.target.closest('[data-act]') : null; if (!t || t.disabled) return;
  auInit(); var act = t.getAttribute('data-act'), v = t.getAttribute('data-v');
  if (act !== 'equip' && act !== 'buygun' && act !== 'buybg' && act !== 'usebg' && act !== 'repair') sfx('ui');
  switch (act) {
    case 'diff': S.diff = v; dirty = true; uiMenu(); break;
    case 'new': S.run = null; startNew(); break;
    case 'continue': startContinue(); break;
    case 'market': panelState.from = panelState.name === 'menu' ? 'menu' : panelState.name; if (panelState.name === 'over') panelState.from = 'over'; panelState.msg = ''; uiMarket(); break;
    case 'settings': panelState.from = panelState.name; uiSettings(panelState.from); break;
    case 'resume': resumeGame(); break;
    case 'quit': snapshotRun(); persist(); G.paused = false; G.ents.length = 0; G.eprojs.length = 0; G.pprojs.length = 0; G.boss = null; duckMusic(1); uiMenu(); break;
    case 'giveup': G.paused = false; hidePanel(); gameOver('guns'); break;
    case 'back': panelState.msg = ''; backFromSub(); break;
    case 'menu': G.ents.length = 0; G.boss = null; uiMenu(); break;
    case 'next': hidePanel(); nextAfterBoss(); break;
    case 'music': S.music = v === '1'; applyAudioPrefs(); uiSettings(panelState.from); break;
    case 'sfx': S.sfx = v === '1'; applyAudioPrefs(); uiSettings(panelState.from); break;
    case 'quality': setQuality(v); uiSettings(panelState.from); break;
    default: marketAct(act, v);
  }
});

// ----- HUD and gun slots -----
var hudLast = { lives: -1, max: -1 }, slotEls = [], slotKey = '';
function buildSlots() {
  slotsEl.innerHTML = ''; slotEls = [];
  S.owned.forEach(function (id, n) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'slot'; b.setAttribute('aria-label', GUNS[id].name);
    b.innerHTML = '<canvas width="64" height="96"></canvas><span class="num">' + (id + 1) + '</span><span class="hp"><i></i></span><span class="cd" hidden></span>';
    gunPreview(id, b.querySelector('canvas'));
    b.addEventListener('pointerdown', function (e) { e.stopPropagation(); e.preventDefault(); auInit(); if (!G.paused && (G.mode === 'play' || G.mode === 'boss')) { var r = swapGun(id); if (r === 'cooldown') { sfx('deny'); floatText(W / 2, H * 0.6, 'SWAP IN ' + G.swapCd.toFixed(1), '#ffd23f', 0); } else if (r === 'broken') sfx('deny'); } });
    slotsEl.appendChild(b); slotEls.push({ id: id, b: b, hp: b.querySelector('.hp i'), cd: b.querySelector('.cd') });
  });
}
function updateHud() {
  if (hudEl.hidden) return;
  var acc = G.shots ? Math.round(G.hits / G.shots * 100) + '%' : '--';
  $('hLevel').textContent = G.level; $('hAcc').textContent = acc; $('hScore').textContent = fmt(G.score); $('hCombo').textContent = 'x' + (1 + Math.min(G.combo, 30) * 0.01).toFixed(2); $('hCoins').textContent = fmt(S.coins);
  if (hudLast.lives !== G.lives || hudLast.max !== G.maxLives) {
    hudLast.lives = G.lives; hudLast.max = G.maxLives; var h = '';
    for (var i = 0; i < G.maxLives; i++) h += '<i class="life' + (i < G.lives ? '' : ' off') + '"></i>';
    $('hLives').innerHTML = h;
  }
  hudDirty = false;
}
function updateSlots() {
  if (slotsEl.hidden) return;
  var key = S.owned.join(','); if (key !== slotKey) { slotKey = key; buildSlots(); }
  for (var i = 0; i < slotEls.length; i++) {
    var s = slotEls[i], hp = G.gunHP[s.id], mx = GUNS[s.id].hp;
    s.hp.style.width = clamp(hp / mx, 0, 1) * 100 + '%'; s.b.classList.toggle('on', s.id === G.gun); s.b.classList.toggle('broken', hp <= 0);
    var cd = G.swapCd > 0 && s.id !== G.gun && hp > 0 && (G.mode === 'play' || G.mode === 'boss'); s.cd.hidden = !cd; if (cd) s.cd.textContent = Math.ceil(G.swapCd);
  }
}

// ----- input -----
var pointerId = -1;
function aimFrom(e) { var r = canvas.getBoundingClientRect(); G.aimX = (e.clientX - r.left) * (W / r.width); G.aimY = (e.clientY - r.top) * (H / r.height); }
canvas.addEventListener('pointerdown', function (e) {
  auInit(); G.touch = e.pointerType === 'touch' || e.pointerType === 'pen'; aimFrom(e);
  if (G.paused || (G.mode !== 'play' && G.mode !== 'boss')) return;
  e.preventDefault(); pointerId = e.pointerId; try { canvas.setPointerCapture(e.pointerId); } catch (x) {}
  G.hold = true;
});
canvas.addEventListener('pointermove', function (e) { aimFrom(e); if (e.pointerType === 'mouse') G.touch = false; });
function endPtr(e) { if (e.pointerId === pointerId) { G.hold = false; pointerId = -1; } }
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr); canvas.addEventListener('lostpointercapture', endPtr);
canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
window.addEventListener('keydown', function (e) {
  if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  var k = e.key;
  if (k === 'p' || k === 'P' || k === 'Escape') { if (!e.repeat) { auInit(); togglePause(); } e.preventDefault(); }
  else if (k === 'm' || k === 'M') { S.music = S.sfx = !(S.music || S.sfx); applyAudioPrefs(); }
  else if (k >= '1' && k <= '8') { var id = +k - 1; if (!G.paused && (G.mode === 'play' || G.mode === 'boss') && S.owned.indexOf(id) >= 0) { var r = swapGun(id); if (r === 'cooldown' || r === 'broken') sfx('deny'); } }
  else if (k === ' ' || k === 'Enter') {
    if (G.mode === 'menu' && !overlay.hidden && panelState.name === 'menu') { e.preventDefault(); if (S.run) startContinue(); else startNew(); }
    else if ((G.mode === 'play' || G.mode === 'boss') && !G.paused && k === ' ') { e.preventDefault(); if (!e.repeat) { G.hold = true; G.aimX = G.aimX || W / 2; } }
  }
});
window.addEventListener('keyup', function (e) { if (e.key === ' ') G.hold = false; });
btnPause.addEventListener('click', function () { auInit(); togglePause(); });
btnMute.addEventListener('click', function () { auInit(); S.music = S.sfx = !(S.music || S.sfx); applyAudioPrefs(); if (S.music) { if (G.mode === 'menu') musicPlay('menu', 0); } });
document.addEventListener('visibilitychange', function () { if (document.hidden && !G.paused && (G.mode === 'play' || G.mode === 'boss')) uiPause(); });
window.addEventListener('blur', function () { G.hold = false; });
document.addEventListener('pointerdown', function () { auInit(); }, { once: false, passive: true });

// ----- loop and quality governor -----
var lastT = 0, fAcc = 0, fN = 0, goodT = 0, layoutPending = false;
function layoutSoon() { layoutPending = true; }
function frame(now) {
  requestAnimationFrame(frame);
  if (!lastT) lastT = now;
  var raw = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (layoutPending) { layoutPending = false; layout(); }
  if (!G.paused && G.mode !== 'boot') { time += raw; update(raw * G.ts, raw); }
  else if (G.mode === 'boot') time += raw;
  if (G.mode === 'menu' && G.paused) G.paused = false;
  draw();
  if (hudDirty) updateHud();
  if (!slotsEl.hidden) { slotT += raw; if (slotT > 0.1) { slotT = 0; updateSlots(); } }
  // governor: only runs while playing
  if (S.quality === 'auto' && (G.mode === 'play' || G.mode === 'boss') && !G.paused) {
    fAcc += raw; fN++;
    if (fAcc > 2.5) {
      var avg = fAcc / fN * 1000; fAcc = 0; fN = 0;
      if (avg > 26 && qi > 1) { qi--; Q = QTAB[qi]; layout(); goodT = 0; }
      else if (avg < 15) { goodT += 2.5; if (goodT > 12 && qi < 3) { qi++; Q = QTAB[qi]; layout(); goodT = 0; } } else goodT = 0;
    }
  }
}
var slotT = 0;
if (window.ResizeObserver) new ResizeObserver(function () { layoutSoon(); }).observe(field); else window.addEventListener('resize', layoutSoon);
window.addEventListener('orientationchange', function () { setTimeout(layoutSoon, 250); });

// ----- boot: load the pictures, build the art, show the menu -----
function loadImg(src, cb) { var im = new Image(); im.onload = function () { cb(im); }; im.onerror = function () { cb(null); }; im.src = src; }
function boot() {
  loadSave(); setAudioFlags(S.music, S.sfx); syncMute();
  if (S.quality !== 'auto') qi = { low: 1, medium: 2, high: 3 }[S.quality] || 3; else qi = (window.devicePixelRatio > 2 || navigator.hardwareConcurrency <= 4) ? 2 : 3; Q = QTAB[qi];
  loadImg(IMG_TARGET, function (a) {
    loadImg(IMG_BOSS, function (b) {
      if (!a || !b) { panel.innerHTML = '<h2>Could not load the pictures.</h2>'; overlay.hidden = false; return; }
      buildHamim(a); buildBoss(b); buildBackgrounds(); buildGuns();
      layout(); G.mode = 'menu'; uiMenu(); layout();
      requestAnimationFrame(frame);
    });
  });
}
if (/debug/.test(location.hash)) {
  window.__HB = { ev: function (s) { return eval(s); } };
}
document.fonts && document.fonts.ready && document.fonts.ready.then(function () {});
boot();

})();
